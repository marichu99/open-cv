server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # connect-src covers docker-compose's default backend (http://localhost:8000,
    # REST + Socket.IO on the same origin — see docker-compose.yml's frontend
    # build args). If this image is deployed with different
    # VITE_API_URL/VITE_SOCKET_URL build args (e.g. the "Backend — Cloud Run"
    # baseline in docs/DEPLOYMENT.md), update connect-src to match — the CSP
    # doesn't read those build args automatically. The live production
    # deployment serves from Firebase Hosting instead; see frontend/firebase.json
    # for its (already-correct) CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:8000 ws://localhost:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Client-side routing (react-router) — always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
